name: Generate Contribution Snake

on:
  # Update daily at 00:00 UTC
  schedule:
    - cron: "0 0 * * *"
  # Let you run it manually from the Actions tab
  workflow_dispatch:
  # Also run on pushes to main so it appears right away
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: Vatsakala
          # Create both light and dark variants
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
